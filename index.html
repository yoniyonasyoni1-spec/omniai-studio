<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 text-2xl"></i>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">OmniAI Studio</span>
      </div>
      <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-mono">v1.0 Live</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold mb-3">AI Powered Text Intelligence</h1>
      <p class="text-slate-400">Summarize, expand, or refine your content in seconds.</p>
    </div>

    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">Select Action</label>
          <select id="action" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white">
            <option value="summarize">Summarize Content</option>
            <option value="expand">Expand into Blog Post</option>
            <option value="proofread">Improve & Proofread</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">Target Language</label>
          <select id="language" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white">
            <option value="English">English</option>
            <option value="Amharic">Amharic (አማርኛ)</option>
            <option value="Spanish">Spanish</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-400 mb-1">Your Input Text</label>
        <textarea id="inputText" rows="5" placeholder="Paste your text here..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-slate-200"></textarea>
      </div>

      <button id="generateBtn" onclick="generateAIOutput()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg flex justify-center items-center gap-2">
        <i class="fa-solid fa-bolt"></i> <span id="btnText">Generate Output</span>
      </button>

      <div id="outputContainer" class="mt-6 hidden">
        <label class="block text-sm font-medium text-slate-400 mb-1">AI Output Result</label>
        <div id="outputText" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-4 text-sm text-slate-200 whitespace-pre-wrap leading-relaxed"></div>
      </div>
    </div>
  </main>

  <footer class="text-center py-6 border-t border-slate-800 text-slate-500 text-xs">
    © 2026 OmniAI Studio.
  </footer>

  <script>
    async function generateAIOutput() {
      const inputText = document.getElementById('inputText').value.trim();
      const action = document.getElementById('action').value;
      const language = document.getElementById('language').value;
      const btnText = document.getElementById('btnText');
      const outputContainer = document.getElementById('outputContainer');
      const outputText = document.getElementById('outputText');

      if (!inputText) {
        alert('እባክዎን መጀመሪያ ጽሁፍ ያስገቡ!');
        return;
      }

      const apiKey = "AIzaSyAtepJ0sFWRTztGFMststRRLnXGJX8Egw";

      btnText.innerText = "Processing...";
      outputContainer.classList.add('hidden');

      const prompt = `Perform action '${action}' on the following text and translate/output the response strictly in ${language}:\n\n${inputText}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          outputText.innerText = data.candidates[0].content.parts[0].text;
          outputContainer.classList.remove('hidden');
        } else {
          alert('ምላሽ ማግኘት አልተቻለም። እባክዎን እንደገና ይሞክሩ።');
        }
      } catch (error) {
        alert('ስህተት ተፈጥሯል፡ ' + error.message);
      } finally {
        btnText.innerText = "Generate Output";
      }
    }
  </script>
</body>
</html>
